name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, unit/integration tests, lint and instrumented test APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-widget-debug-and-reports
          path: |
            app/build/outputs/apk/
            app/build/outputs/widget-fixtures/
            app/build/outputs/documentation/
            app/build/outputs/connection-fixtures/
            app/build/outputs/widget-previews/
            app/build/outputs/icon-fixtures/
            app/build/reports/
            app/build/test-results/
